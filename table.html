<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ที่นั่งของฉัน · Lertnalid & Pinyapat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Kanit',system-ui,sans-serif;font-weight:300;background:#F6F2EA;color:#2A1E16;
     min-height:100svh;display:flex;flex-direction:column;align-items:center;
     padding:34px 22px 50px;text-align:center}
.mono{font-family:Georgia,serif;font-size:.68rem;letter-spacing:.42em;color:#A9854F;
      text-transform:uppercase;text-indent:.42em}
h1{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:1.5rem;margin-top:8px}
.sub-en{font-family:Georgia,serif;font-size:.62rem;letter-spacing:.34em;color:#B0A28C;
      text-transform:uppercase;margin-top:4px;text-indent:.34em}
.card{width:min(360px,100%);margin-top:26px;background:#FDFBF6;border:1px solid rgba(178,141,87,.4);
      border-radius:18px;padding:30px 22px;box-shadow:0 16px 44px rgba(120,90,50,.12)}
.lbl{font-size:.6rem;letter-spacing:.3em;color:#9A876B;text-transform:uppercase;text-indent:.3em}
.name{font-size:1.12rem;font-weight:400;color:#5C4327;margin-top:6px}
.tbl{font-family:Georgia,serif;font-size:3.6rem;color:#7A5C33;line-height:1.15;margin-top:16px}
.tbl small{display:block;font-family:'Kanit';font-size:.66rem;color:#9A876B;letter-spacing:.24em;
     text-transform:uppercase}
.seats{font-size:.78rem;color:#8A7458;margin-top:12px}
.wait{font-size:.82rem;line-height:1.9;color:#8A7458;margin-top:14px}
.en{display:block;font-family:Georgia,serif;font-style:italic;font-size:.86em;color:#B0A28C;margin-top:3px}
.find{width:min(360px,100%);margin-top:22px}
input{width:100%;font:inherit;font-size:.95rem;padding:12px 14px;border:1px solid #D8C9AF;
      border-radius:11px;background:#FDFBF6;outline:none;text-align:center}
button{font:inherit;font-size:.82rem;margin-top:10px;padding:11px 22px;border:1px solid #B08D57;
       border-radius:11px;background:none;color:#7A5C33;cursor:pointer;letter-spacing:.1em}
.hit{margin-top:10px;padding:12px;border:1px solid #E4D8C2;border-radius:11px;background:#FDFBF6;
     display:flex;justify-content:space-between;align-items:center;gap:10px}
.hit b{font-weight:400;font-size:.9rem}
.hit span{font-family:Georgia,serif;color:#7A5C33;font-size:1.05rem;white-space:nowrap}
.roster{white-space:pre-line;text-align:left;display:inline-block;margin-top:14px;
     font-size:.82rem;line-height:1.8;color:#5A4630;border-top:1px solid #E4D8C2;padding-top:12px}
.note{font-size:.66rem;color:#B0A28C;margin-top:26px;line-height:1.8}
/* ── ยืนยันรอบสอง ── */
.rc-head{font-size:.62rem;letter-spacing:.26em;color:#9A876B;text-transform:uppercase;text-indent:.26em}
.rc-sub{font-size:.8rem;line-height:1.8;color:#8A7458;margin-top:10px}
.rc-row{display:flex;gap:10px;margin-top:16px}
.rc-row button{flex:1;margin-top:0;min-width:0;line-height:1.5}
.rc-row button i{display:block;font-style:normal;font-family:Georgia,serif;font-size:.6rem;
     letter-spacing:.12em;color:#B0A28C;text-transform:uppercase;margin-top:2px}
.rc-row button.on{background:rgba(176,141,87,.16);border-color:#8A6A3F;color:#4A3018}
.rc-done{font-size:.8rem;color:#7A5C33;margin-top:14px;line-height:1.8}
</style></head><body>
<p class="mono">S &amp; L · 12.09.2026</p>
<h1>ที่นั่งของฉัน</h1>
<p class="sub-en">My seat</p>
<div id="out"></div>
<div id="rc"></div>
<div class="find" id="find" hidden>
  <input id="q" placeholder="พิมพ์ชื่อ หรือรหัส SL-… · Name or code">
  <button id="go">ค้นหาที่นั่ง · FIND MY SEAT</button>
  <div id="hits"></div>
</div>
<p class="note">แสดงหน้านี้พร้อม QR ที่จุดลงทะเบียน · Grand Ballroom ชั้น 2<span class="en">Show this page at the registration desk</span></p>
<script>
var EP='https://script.google.com/macros/s/AKfycbw4jHiuaTHZXed987vl1f0U-2tcgH1CGjMBYNhadc36vJ9qCECUdlqxk5TmAiMovqFu/exec';
var out=document.getElementById('out'), find=document.getElementById('find'), rc=document.getElementById('rc');
var CODE='';
function esc(x){return String(x==null?'':x).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
/* รายชื่อรายคนจากชีต — ยังไม่มีคอลัมน์นี้ก็คืนค่าว่าง การ์ดเหมือนเดิม */
function roster(j){
  if(j.guestsText) return String(j.guestsText);
  var g=j.guests;
  if(typeof g==='string'){ try{g=JSON.parse(g);}catch(e){return g;} }
  if(!Array.isArray(g)||!g.length) return '';
  return g.map(function(p,i){
    return (i+1)+'. '+(p.n||p.name||'-')+((p.d||p.diet)?' ('+(p.d||p.diet)+')':'');
  }).join('\n');
}
function cardHTML(name,table,seats,checkin,list){
  var t=table?('<p class="tbl">'+esc(table)+'<small>โต๊ะของคุณ · YOUR TABLE</small></p>')
             :('<p class="wait">ทีมงานกำลังจัดผังที่นั่ง 🤍<br>กรุณาเปิดดูอีกครั้งใกล้วันงาน หรือสอบถามที่จุดลงทะเบียน'+
               '<span class="en">Seating is being arranged — please check back closer to the day</span></p>');
  return '<div class="card"><p class="lbl">Guest</p><p class="name">'+esc(name)+'</p>'+t+
    (seats?'<p class="seats">'+esc(seats)+' ที่นั่ง · seats'+(checkin?' · เช็คอินแล้ว '+esc(checkin):'')+'</p>':'')+
    (list?'<p class="roster">'+esc(list)+'</p>':'')+'</div>';
}
/* ── ยืนยันการมาร่วมงานรอบสอง (จากลิงก์/QR ส่วนตัว) ── */
function rcHTML(){
  var saved=localStorage.getItem('rc_'+CODE);
  return '<div class="card">'+
    '<p class="rc-head">ยืนยันการมาร่วมงาน · Kindly reconfirm</p>'+
    '<p class="rc-sub">ใกล้ถึงวันงานแล้ว ช่วยยืนยันอีกครั้ง เพื่อให้เราจัดทุกที่นั่งได้พอดี'+
    '<span class="en">The day is near — a quick reconfirm helps us set every seat just right</span></p>'+
    '<div class="rc-row">'+
    '<button id="rcYes" class="'+(saved==='yes'?'on':'')+'">มาแน่นอน ✓<i>I\'ll be there</i></button>'+
    '<button id="rcNo" class="'+(saved==='no'?'on':'')+'">มีเปลี่ยนแปลง<i>Plans changed</i></button>'+
    '</div><p class="rc-done" id="rcDone">'+
    (saved==='yes'?'ยืนยันแล้ว ขอบคุณค่ะ 🤍 · Reconfirmed, thank you':
     saved==='no'?'รับทราบแล้ว ขอบคุณที่บอกกัน · Noted with love':'')+
    '</p></div>';
}
function bindRC(){
  ['Yes','No'].forEach(function(k){
    var b=document.getElementById('rc'+k); if(!b)return;
    b.onclick=function(){
      var ans=(k==='Yes')?'yes':'no';
      var done=document.getElementById('rcDone');
      done.textContent='กำลังบันทึก… · Saving…';
      fetch(EP+'?action=reconfirm&code='+encodeURIComponent(CODE)+'&ans='+ans)
        .then(function(r){return r.json();})
        .then(function(j){
          if(!j.ok) throw 0;
          localStorage.setItem('rc_'+CODE,ans);
          rc.innerHTML=rcHTML(); bindRC();
        })
        .catch(function(){done.textContent='บันทึกไม่สำเร็จ ลองอีกครั้ง · Could not save, please retry';});
    };
  });
}
function byCode(c){
  CODE=c;
  out.innerHTML='<div class="card"><p class="wait">กำลังค้นหา… · Searching…</p></div>';
  fetch(EP+'?action=seat&code='+encodeURIComponent(c)).then(r=>r.json()).then(function(j){
    if(j.ok){
      out.innerHTML=cardHTML(j.name,j.table,j.seats,j.checkin,roster(j));
      /* สถานะยืนยันจากชีตชนะเครื่อง — เปิดมือถือเครื่องไหนก็เห็นตรงกัน */
      if(j.reconfirm==='มาแน่นอน')localStorage.setItem('rc_'+CODE,'yes');
      else if(j.reconfirm==='มีเปลี่ยนแปลง')localStorage.setItem('rc_'+CODE,'no');
      rc.innerHTML=rcHTML(); bindRC();
    }
    else{out.innerHTML='';find.hidden=false;
         document.getElementById('q').value=c;
         document.getElementById('hits').innerHTML=
           '<p class="wait">ไม่พบรหัสนี้ — ลองค้นด้วยชื่อได้เลย<span class="en">Code not found — try your name</span></p>';}
  }).catch(function(){out.innerHTML='<div class="card"><p class="wait">เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง<span class="en">Connection failed — please retry</span></p></div>';});
}
document.getElementById('go').onclick=function(){
  var q=document.getElementById('q').value.trim();
  if(!q)return;
  if(/^SL-/i.test(q)){byCode(q.toUpperCase());return;}
  var h=document.getElementById('hits');
  h.innerHTML='<p class="wait">กำลังค้นหา… · Searching…</p>';
  fetch(EP+'?action=seatByName&q='+encodeURIComponent(q)).then(r=>r.json()).then(function(j){
    if(!j.ok||!j.hits||!j.hits.length){h.innerHTML='<p class="wait">ไม่พบชื่อนี้ในรายชื่อผู้ตอบรับ<span class="en">Name not found in the guest list</span></p>';return;}
    h.innerHTML=j.hits.map(function(x){
      return '<div class="hit"><b>'+esc(x.name)+'</b><span>'+(x.table?('โต๊ะ '+esc(x.table)):'รอจัด · TBA')+'</span></div>';
    }).join('');
  });
};
var c=new URLSearchParams(location.search).get('c');
if(c)byCode(c); else find.hidden=false;
</script></body></html>
